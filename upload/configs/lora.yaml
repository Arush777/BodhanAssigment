# LoRA finetune of bodhan-ai/indic-translate on filtered en<->mr Samanantar.
#
# Derived from the toolkit's provisional configs/mt/train/lora.yaml.
# Every delta from that default is marked CHANGED with a reason, because the
# defaults are tuned for an 8-GPU node and a document corpus; we have one A100
# and a sentence corpus.

model:
  model_path: "bodhan-ai/indic-translate"   # finetune from a model that already translates
  tokenizer_path: ""
  max_seq_length: 1024            # CHANGED 8192->1024. Sentence bitext sits far under
                                  # 8192; the default wastes memory we need for batch.
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"
  gradient_checkpointing: true
  adapter_path: null

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules: "all-linear"    # Gemma 4 has per_layer_input_gate / per_layer_projection
                                  # beside q/k/v/o; an explicit list silently misses them.
  exclude_modules:
    - "*vision_tower*"
    - "*visual*"
    - "*image_encoder*"
    - "*audio_tower*"
    - "*embed_vision*"
    - "*embed_audio*"
    - "*lm_head*"
  modules_to_save: []
  use_rslora: false
  use_dora: false

data:
  train_file: "data/mt/rendered/train.jsonl"
  dev_file: "data/mt/rendered/dev.jsonl"
  cache_dir: "data/mt/cache"
  num_proc: 12                    # CHANGED 16->12; a100-large has 12 vCPU
  shuffle_seed: 42

resume: true

training:
  output_dir: "training_output/mr-lora"
  num_train_epochs: 1             # CHANGED 3->1. We want the degradation curve within
                                  # one epoch, not a converged model.
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine_with_min_lr"
  lr_scheduler_kwargs:
    min_lr: 1.0e-5
  warmup_steps: 0.03
  max_grad_norm: 5.0

  per_device_train_batch_size: 8  # CHANGED 1->8. The default is sized for 8192-token
  gradient_accumulation_steps: 4  # documents. At 1024 with short sentences, bsz 1 leaves
                                  # the A100 almost idle. Effective batch = 8 x 4 = 32.
  per_device_eval_batch_size: 8
  bf16: true
  dataset_num_proc: 12

  # Checkpoint cadence drives the whole experiment: each saved adapter is one
  # point on the quality-vs-steps curve. ~1563 steps/epoch at effective batch 32.
  eval_strategy: "steps"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 100                 # CHANGED 250->100. Degradation on an already-converged
                                  # model is fastest in the first few hundred steps and
                                  # flat after, so we sample densely early and evaluate at
                                  # LOG-spaced points (100/200/400/800/1600) rather than
                                  # uniformly -- same number of eval points, ~3x the
                                  # resolution where the curve actually moves.
  save_total_limit: 20            # CHANGED 3->20; the early checkpoints ARE the experiment

  logging_steps: 10
  load_best_model_at_end: false   # CHANGED true->false. Best-by-eval_loss would discard
                                  # the early checkpoints the curve is made of.
  early_stopping_patience: 999    # CHANGED 5->effectively off. NOTE: this still
                                  # CONSTRUCTS an EarlyStoppingCallback -- patience 999
                                  # means it never fires, not that it is absent -- and
                                  # that callback asserts metric_for_best_model is set.
                                  # Dropping the two lines below crashes at on_train_begin.
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  seed: 42

  # Ephemeral disk: an HF Job's filesystem is destroyed on exit. Anything not
  # pushed to the Hub mid-run is A100 time set on fire.
  push_to_hub: true
  hub_model_id: "Arushhh/indic-translate-mr-lora"
  hub_strategy: "all_checkpoints"
  hub_private_repo: true

  report_to: "wandb"              # W&B key passed to the job as a secret

logging:
  wandb_project: "bodhan-mt-marathi"
  report_to: "wandb"
