# bitext JSONL -> instruction chat rows, via bodhan_genai.mt.data.render
#
# We do NOT hand-write the prompt. The renderer owns the frozen contract
# (target-language-only phrasing, no system turn, 12 instruction variants).
# Reimplementing it is the documented way to silently degrade the model.

seed: 42
template_variant: "target_only"   # the released contract. Do not change.
dedup: true
extra_languages: {}

output:
  train: "data/mt/rendered/train.jsonl"
  dev: "data/mt/rendered/dev.jsonl"
  dev_fraction: 0.02
  dev_max_rows: 1000              # eval runs often; a big dev set only burns wall-clock

sources:
  - name: "samanantar-mr-filtered"
    path: "data/bitext/samanantar_en_mr.jsonl"
    src_field: "eng"
    tgt_field: "mar"
    src_lang: "eng_Latn"
    tgt_lang: "mar_Deva"
    reverse_fraction: 1.0         # 25k pairs -> 50k rows, both directions
    limit: null
